[defaults]
inventory = inventory/aws_ec2.yml
remote_user = ubuntu
host_key_checking = False
timeout = 30
roles_path = roles
stdout_callback = yaml

[inventory]
enable_plugins = aws_ec2

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyJump=ubuntu@${BASTION_IP}
