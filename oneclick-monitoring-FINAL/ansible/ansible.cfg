[defaults]
inventory = inventory/aws_ec2.yml
remote_user = ubuntu
host_key_checking = False
private_key_file = ~/.ssh/geeta.pem
timeout = 30

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
           -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/geeta.pem ubuntu@${BASTION_IP}"
