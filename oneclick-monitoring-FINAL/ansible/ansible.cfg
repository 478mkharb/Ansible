[defaults]
inventory = inventory/aws_ec2.yml
remote_user = ubuntu
host_key_checking = False
timeout = 30
transport = ssh

[ssh_connection]
ssh_args = \
  -o ForwardAgent=yes \
  -o IdentitiesOnly=yes \
  -o IdentityAgent=${SSH_AUTH_SOCK} \
  -o StrictHostKeyChecking=no \
  -o UserKnownHostsFile=/dev/null \
  -o GlobalKnownHostsFile=/dev/null

pipelining = True

