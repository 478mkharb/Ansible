ansible_user: ubuntu

# Private key exists ONLY on Jenkins
ansible_ssh_private_key_file: /var/lib/jenkins/.ssh/oneclick

# SSH via bastion with agent forwarding
ansible_ssh_common_args: >
  -o ForwardAgent=yes
  -o ProxyJump=ubuntu@{{ lookup('env','BASTION_IP') }}
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
