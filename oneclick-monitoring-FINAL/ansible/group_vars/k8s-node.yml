ansible_user: ubuntu
ansible_ssh_private_key_file: /var/lib/jenkins/.ssh/oneclick

ansible_ssh_common_args: >
  -o ProxyCommand="ssh
  -i /var/lib/jenkins/.ssh/oneclick
  -o IdentitiesOnly=yes
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -W %h:%p
  ubuntu@{{ lookup('env','BASTION_IP') }}"
