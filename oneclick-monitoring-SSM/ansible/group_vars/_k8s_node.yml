ansible_connection: amazon.aws.aws_ssm
ansible_user: ubuntu

# REQUIRED to avoid S3 auto-bucket bug
ansible_aws_ssm_bucket_name: ""
ansible_aws_ssm_s3_endpoint_url: ""

# for SSM
ansible_shell_type: sh
ansible_shell_executable: /bin/bash


# Force HOME so `echo ~` never breaks
ansible_env:
  HOME: /home/ubuntu

# SSM stability
ansible_aws_ssm_region: ap-south-1
ansible_aws_ssm_timeout: 60
ansible_aws_ssm_retries: 3
