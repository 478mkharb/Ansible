---
- name: Update apt cache (Ubuntu/Debian)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Ensure python3 is installed
  apt:
    name: python3
    state: present
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Ensure python3-pip is installed
  apt:
    name: python3-pip
    state: present
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Install Kubernetes Python libraries
  pip:
    name:
      - kubernetes
      - openshift
    state: present
