---
- name: Ensure root .kube directory exists
  file:
    path: /root/.kube
    state: directory
    mode: '0700'
  become: true

- name: Copy k3s kubeconfig for root
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  become: true

- name: Fix kubeconfig server address
  replace:
    path: /root/.kube/config
    regexp: 'https://127.0.0.1:6443'
    replace: "https://{{ ansible_default_ipv4.address }}:6443"
  become: true
