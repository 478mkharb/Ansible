---
- name: Install base packages
  apt:
    name:
      - curl
      - tar
      - apt-transport-https
    update_cache: yes

# Install node_exporter on ALL hosts
- import_tasks: node_exporter.yml

# Prometheus only on monitoring host
- name: Create monitoring directory
  file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: '0755'

- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus.tar.gz

- name: Extract Prometheus
  unarchive:
    src: /tmp/prometheus.tar.gz
    dest: "{{ monitoring_dir }}"
    remote_src: yes

- name: Symlink Prometheus binaries
  file:
    src: "{{ monitoring_dir }}/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    mode: '0755'
  loop:
    - prometheus
    - promtool

- name: Deploy Prometheus config
  template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus.yml"
  notify: Restart Prometheus

- name: Create Prometheus service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/prometheus \
        --config.file={{ monitoring_dir }}/prometheus.yml \
        --storage.tsdb.path={{ monitoring_dir }}/data

      [Install]
      WantedBy=multi-user.target
  notify: Restart Prometheus

# Grafana
- name: Install Grafana
  apt:
    name: grafana
    state: present

- name: Deploy Grafana datasource
  template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
  notify: Restart Grafana
