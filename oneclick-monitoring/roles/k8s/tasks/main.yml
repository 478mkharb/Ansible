---
- name: Disable swap
  command: swapoff -a
  changed_when: false

- name: Comment swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'

- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
    update_cache: yes

- name: Install K3s
  shell: |
    curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION={{ k3s_version }} sh -
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is running
  systemd:
    name: k3s
    state: started
    enabled: true

- name: Create kubeconfig directory
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    mode: '0755'

- name: Copy kubeconfig for ubuntu user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    mode: '0644'
    remote_src: yes
