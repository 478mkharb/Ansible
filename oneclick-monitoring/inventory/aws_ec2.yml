plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1

filters:
  "tag:Project": "oneclick-monitoring"

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""

hostnames:
  - tag:Name

compose:
  ansible_host: public_ip_address
  ansible_user: ubuntu
  ansible_ssh_private_key_file: var/lib/jenkins/server3.pem

strict: False
