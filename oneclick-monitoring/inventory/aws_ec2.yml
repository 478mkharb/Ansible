plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1

filters:
  "tag:Project": "oneclick-monitoring"

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""

hostnames:
  - tag:Name

compose:
  ansible_host: public_ip_address
  ansible_user: ubuntu

vars:
  ansible_python_interpreter: /usr/bin/python3 

strict: False
