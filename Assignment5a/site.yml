---
- name: Configure Application Server
  hosts: role_app
  become: true
  become_user: root
  gather_facts: true
  roles:
    - app_server
    - node_exporter

- name: Configure Monitoring Stack
  hosts: role_monitoring
  become: true
  become_user: root
  gather_facts: true
  roles:
    - prometheus
    - grafana
    - blackbox
