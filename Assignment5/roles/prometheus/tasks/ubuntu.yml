---
- name: Create prometheus user
  user:
    name: prometheus
    system: yes
    shell: /usr/sbin/nologin

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_data_dir }}"
    - /etc/prometheus

# ---------- Use git instead of get_url ----------
- name: Clone Prometheus repository for version {{ prometheus_version }}
  git:
    repo: "https://github.com/prometheus/prometheus.git"
    version: "v{{ prometheus_version }}"
    dest: "/tmp/prometheus-src"
    depth: 1

- name: Extract Prometheus binaries
  copy:
    src: "/tmp/prometheus-src/{{ item }}"
    dest: /usr/local/bin/{{ item }}
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - prometheus
    - promtool

- name: Copy console files
  copy:
    src: "/tmp/prometheus-src/{{ item }}"
    dest: /etc/prometheus/
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - consoles
    - console_libraries

- name: Copy Prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: restart prometheus

- name: Create systemd service
  template:
    src: prometheus.service.yml.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus
