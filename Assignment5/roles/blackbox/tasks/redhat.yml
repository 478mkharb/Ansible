---
- name: Create blackbox user
  user:
    name: blackbox
    system: yes
    shell: /sbin/nologin

# Clone Blackbox Exporter repo (source)
- name: Clone Blackbox Exporter repository
  git:
    repo: https://github.com/prometheus/blackbox_exporter.git
    dest: /opt/blackbox_exporter
    version: v0.25.0
    force: yes

# Build or use precompiled binary (optional if you want release binaries)
# For simplicity, using prebuilt binary inside cloned repo's release archive
- name: Copy blackbox binary
  copy:
    src: /opt/blackbox_exporter/blackbox_exporter
    dest: /usr/local/bin/blackbox_exporter
    owner: blackbox
    group: blackbox
    mode: '0755'
    remote_src: yes

# Copy configuration
- name: Copy blackbox config
  copy:
    src: blackbox.yml
    dest: /etc/blackbox.yml
    owner: blackbox
    group: blackbox
    mode: '0644'

# -------- SELinux fixes --------
- name: Set SELinux context for blackbox config
  sefcontext:
    target: /etc/blackbox.yml
    setype: etc_t

- name: Set SELinux context for blackbox binary
  sefcontext:
    target: /usr/local/bin/blackbox_exporter
    setype: bin_t

- name: Apply SELinux contexts
  command: restorecon -Rv /etc/blackbox.yml /usr/local/bin/blackbox_exporter

# -------- Systemd service --------
- name: Create systemd service
  copy:
    dest: /etc/systemd/system/blackbox_exporter.service
    content: |
      [Unit]
      Description=Blackbox Exporter
      After=network.target

      [Service]
      User=blackbox
      Group=blackbox
      ExecStart=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  command: systemctl daemon-reexec

- name: Enable and start blackbox exporter
  systemd:
    name: blackbox_exporter
    enabled: yes
    state: started
