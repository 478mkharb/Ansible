---
- name: Create blackbox user
  user:
    name: blackbox
    system: yes
    shell: /usr/sbin/nologin

# Clone blackbox_exporter repo at a specific tag
- name: Clone blackbox_exporter repository
  git:
    repo: https://github.com/prometheus/blackbox_exporter.git
    dest: /opt/blackbox_exporter
    version: v0.25.0
    force: yes

# Copy the binary from the cloned repo (prebuilt binary if available)
- name: Install blackbox_exporter binary
  copy:
    src: /opt/blackbox_exporter/blackbox_exporter
    dest: /usr/local/bin/blackbox_exporter
    owner: blackbox
    group: blackbox
    mode: '0755'
    remote_src: yes

# Copy configuration
- name: Copy blackbox configuration
  copy:
    src: blackbox.yml
    dest: /etc/blackbox.yml
    owner: blackbox
    group: blackbox
    mode: '0644'

# Create systemd service
- name: Create systemd service for blackbox exporter
  copy:
    dest: /etc/systemd/system/blackbox_exporter.service
    content: |
      [Unit]
      Description=Blackbox Exporter
      After=network.target

      [Service]
      User=blackbox
      Group=blackbox
      ExecStart=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox.yml
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: restart blackbox

# Handlers to restart service
- name: restart blackbox
  systemd:
    name: blackbox_exporter
    state: restarted
    enabled: yes
