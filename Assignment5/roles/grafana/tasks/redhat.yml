---
# CentOS Grafana Installation + Dashboards Provisioning (Jenkins-safe)

- name: Add Grafana YUM repository
  copy:
    dest: /etc/yum.repos.d/grafana.repo
    content: |
      [grafana]
      name=Grafana OSS
      baseurl=https://packages.grafana.com/oss/rpm
      repo_gpgcheck=1
      enabled=1
      gpgcheck=1
      gpgkey=https://packages.grafana.com/gpg.key
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt

- name: Install Grafana
  dnf:
    name: grafana
    state: present

- name: Install required packages
  dnf:
    name:
      - wget
      - policycoreutils-python-utils
    state: present

# Stop Grafana BEFORE provisioning
- name: Stop Grafana service
  systemd:
    name: grafana-server
    state: stopped
  ignore_errors: true

# Create required directories
- name: Create Grafana provisioning and dashboard directories
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

# Prometheus datasource
- name: Copy Prometheus datasource
  copy:
    src: datasource-prometheus.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"

# Dashboard provider
- name: Copy dashboard provider config
  copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: grafana
    group: grafana
    mode: "0644"

# COPY dashboards instead of downloading
- name: Deploy Grafana dashboards
  copy:
    src: "{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop:
    - node-exporter.json
    - prometheus.json
    - blackbox.json

# SELinux fixes
- name: Set SELinux context for Grafana data
  command: chcon -R -t grafana_var_lib_t /var/lib/grafana
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"

- name: Allow Prometheus port 9090 in SELinux
  command: semanage port -a -t http_port_t -p tcp 9090
  register: prometheus_port
  failed_when:
    - prometheus_port.rc != 0
    - "'already defined' not in prometheus_port.stderr"
  changed_when: prometheus_port.rc == 0
  when: ansible_selinux.status == "enabled"

- name: Allow Blackbox exporter port 9115 in SELinux
  command: semanage port -a -t http_port_t -p tcp 9115
  register: blackbox_port
  failed_when:
    - blackbox_port.rc != 0
    - "'already defined' not in blackbox_port.stderr"
  changed_when: blackbox_port.rc == 0
  when: ansible_selinux.status == "enabled"

- name: Allow Grafana outbound network access
  seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_selinux.status == "enabled"

# Firewall
- name: Open Prometheus port in firewall
  firewalld:
    port: 9090/tcp
    permanent: true
    state: enabled
    immediate: true

# Start Grafana
- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: true
    state: started
